<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Sync API Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="/docs/swagger-ui.css" />
  <link rel="icon" type="image/png" href="/docs/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/docs/favicon-16x16.png" sizes="16x16" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
    .topbar {
      display: none;
    }
    .project-sync-brand-header {
      background: #111827;
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #3b82f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .project-sync-brand-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .project-sync-brand-header .badge {
      background: #1e3a8a;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid #3b82f6;
    }
    .project-sync-brand-header .links a {
      color: #93c5fd;
      text-decoration: none;
      font-size: 13px;
      margin-left: 16px;
      font-weight: 500;
    }
    .project-sync-brand-header .links a:hover {
      text-decoration: underline;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="project-sync-brand-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <h1>Project Sync API</h1>
      <span class="badge">v1.0.0</span>
    </div>
    <div class="links">
      <a href="/api/openapi.yaml" target="_blank" rel="noopener noreferrer">Raw OpenAPI (YAML)</a>
      <a href="/api/openapi.json" target="_blank" rel="noopener noreferrer">Raw OpenAPI (JSON)</a>
      <a href="/api/v1/health" target="_blank" rel="noopener noreferrer">Health Status</a>
    </div>
  </div>
  <div id="swagger-ui"></div>

  <script src="/docs/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="/docs/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      // Determine spec url based on current location
      var specUrl = '/api/openapi.yaml';
      
      window.ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        validatorUrl: null,
        persistAuthorization: false,
        displayRequestDuration: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true,
        showExtensions: true,
        showCommonExtensions: true
      });
    };
  </script>
</body>
</html>
