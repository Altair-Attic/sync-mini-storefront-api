              type: string
            product:
              oneOf:
                - $ref: '#/components/schemas/Product'
                - type: 'null'
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    # Order Models
    CheckoutItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          example: 2

    CheckoutRequest:
      type: object
      required:
        - customer_name
        - phone_number
        - fulfilment_method
        - payment_method
        - items
      properties:
        customer_name:
          type: string
          minLength: 2
          maxLength: 120
          example: Amaka Okafor
        phone_number:
          type: string
          description: Nigerian or international telephone number normalized to E.164
          example: '+2348012345678'
        customer_email:
          type: string
          nullable: true
          format: email
          example: amaka@example.com
        fulfilment_method:
          type: string
          description: Customer fulfilment choice. `delivery` requires `delivery_address` and `state`; `pickup` requires both values to be null.
          enum: [pickup, delivery]
          example: delivery
        delivery_address:
          type: string
          nullable: true
          maxLength: 500
          example: 12 Marina Road, Lagos Island
        state:
          type: string
          nullable: true
          maxLength: 100
          example: Lagos
        payment_method:
          type: string
          description: Customer payment choice. Select `paystack` to initialize a Paystack payment after order creation; select `cash_on_delivery` when no online payment initialization is needed.
          enum: [cash_on_delivery, paystack]
          example: paystack
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CheckoutItemInput'

    OrderItemSnapshot:
      type: object
      required:
        - id
        - order_id
        - product_public_id
        - product_title
        - product_slug
        - unit_price_kobo
        - quantity
        - line_total_kobo
        - created_at
      properties:
        id:
          type: string
          example: '1'
        order_id:
          type: string
          example: '1'
        product_id:
          type: string
          nullable: true
          example: '1'
        product_public_id:
          type: string
          format: uuid
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        product_title:
          type: string
          example: Artisan Ceramic Mug
        product_slug:
          type: string
          example: artisan-ceramic-mug
        unit_price_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        quantity:
          type: integer
          example: 2
        line_total_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        created_at:
          type: string
          format: date-time

    OrderStatusHistoryEntry:
      type: object
      required: [id, previous_status, new_status, changed_by, created_at]
      properties:
        id:
          type: string
          example: '1'
        previous_status:
          type: string
          nullable: true
          example: new
        new_status:
          type: string
          example: confirmed
        changed_by:
          type: string
          nullable: true
          example: usr_admin123
        created_at:
          type: string
          format: date-time

    OrderRecord:
      type: object
      required:
        - reference
        - customer_name
        - phone_number
        - fulfilment_method
        - delivery_address
        - state
        - subtotal_kobo
        - delivery_fee_kobo
        - total_kobo
        - currency
        - payment_method
        - payment_status
        - fulfilment_status
        - items
        - created_at
      properties:
        reference:
          type: string
          example: SYNC-2026-ABC123
        customer_name:
          type: string
          example: Amaka Okafor
        phone_number:
          type: string
          example: '+2348012345678'
        customer_email:
          type: string
          nullable: true
          format: email
          example: amaka@example.com
        fulfilment_method:
          type: string
          enum: [pickup, delivery]
          example: delivery
        delivery_address:
          type: string
          nullable: true
          example: 12 Marina Road, Lagos Island
        state:
          type: string
          nullable: true
          example: Lagos
        subtotal_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        delivery_fee_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        total_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        currency:
          type: string
          const: NGN
          example: NGN
        payment_method:
          type: string
          example: paystack
        payment_status:
          type: string
          description: Aggregate order payment status
          enum: [unpaid, pending, paid, refunded]
          example: unpaid
        fulfilment_status:
          type: string
          description: Fulfilment state machine status
          enum: [new, confirmed, processing, ready, completed, cancelled]
          example: new
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemSnapshot'
        created_at:
          type: string
          format: date-time
        whatsapp_url:
          type: string
          nullable: true
          format: uri
          example: https://wa.me/2348012345678?text=Hello...
        confirmation_token:
          type: string
          description: Order-scoped secret token returned at checkout for retrieving confirmation and initializing payment
          example: tok_8f3a9b1c7d2e4f5a6b0c1d2e3f4a5b6c

    OrderCreatedResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/OrderRecord'
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    OrderConfirmationResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/OrderRecord'
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    AdminOrderSummaryItem:
      type: object
      required:
        - id
        - reference
        - customer_name
        - phone_number
        - fulfilment_method
        - subtotal_kobo
        - delivery_fee_kobo
        - total_kobo
        - currency
        - payment_method
        - payment_status
        - fulfilment_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: '1'
        reference:
          type: string
          example: SYNC-2026-ABC123
        customer_name:
          type: string
          example: Amaka Okafor
        phone_number:
          type: string
          example: '+2348012345678'
        customer_email:
          type: string
          nullable: true
          example: amaka@example.com
        fulfilment_method:
          type: string
          enum: [pickup, delivery]
        delivery_address:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        subtotal_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        delivery_fee_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        total_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        currency:
          type: string
          const: NGN
        payment_method:
          type: string
        payment_status:
          type: string
          enum: [unpaid, pending, paid, refunded]
        fulfilment_status:
          type: string
          enum: [new, confirmed, processing, ready, completed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/AdminOrderSummaryItem'
        - type: object
          required: [items, status_history]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemSnapshot'
            status_history:
              type: array
              items:
                $ref: '#/components/schemas/OrderStatusHistoryEntry'

    AdminOrderListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderSummaryItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AdminOrderDetailResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AdminOrderDetail'
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    AdminOrderSummaryResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [all, new, confirmed, processing, ready, completed, cancelled]
          properties:
            all:
              type: integer
              example: 42
            new:
              type: integer
              example: 5
            confirmed:
              type: integer
              example: 8
            processing:
              type: integer
              example: 12
            ready:
              type: integer
              example: 4
            completed:
              type: integer
              example: 11
            cancelled:
              type: integer
              example: 2
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    AdminOrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, confirmed, processing, ready, completed, cancelled]
          example: confirmed

    # Payment Models
    PaymentInitializationResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - payment_reference
            - authorization_url
            - access_code
            - status
            - expected_amount_kobo
            - currency
          properties:
            payment_reference:
              type: string
              example: PAY-SYNC-9AB4C3D2E1F0G8H7J6K5
            authorization_url:
              type: string
              format: uri
              example: https://checkout.paystack.com/access12345
            access_code:
              type: string
              example: access12345
            status:
              type: string
              description: Payment attempt status
              enum: [initialized, pending, successful, failed, abandoned]
              example: pending
            expected_amount_kobo:
              $ref: '#/components/schemas/MoneyKobo'
            currency:
              type: string
              const: NGN
              example: NGN
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    PaymentStatusResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - payment_reference
            - order_reference
            - status
            - payment_status
            - amount_kobo
            - currency
            - resolution_status
          properties:
            payment_reference:
              type: string
              example: PAY-SYNC-9AB4C3D2E1F0G8H7J6K5
            order_reference:
              type: string
              example: SYNC-2026-ABC123
            status:
              type: string
              description: Individual payment attempt status
              enum: [initialized, pending, successful, failed, abandoned]
              example: successful
            payment_status:
              type: string
              description: Aggregate order payment status
              enum: [unpaid, pending, paid, refunded]
              example: paid
            amount_kobo:
              $ref: '#/components/schemas/MoneyKobo'
            currency:
              type: string
              const: NGN
              example: NGN
            resolution_status:
              type: string
              description: Operational action status
              enum: [none, requires_action]
              example: none
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    AdminPaymentAttempt:
      type: object
      required:
        - id
        - payment_reference
        - order_id
        - provider
        - provider_reference
        - amount_kobo
        - currency
        - status
        - resolution_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: '1'
        payment_reference:
          type: string
          example: PAY-SYNC-9AB4C3D2E1F0G8H7J6K5
        order_id:
          type: string
          example: '1'
        provider:
          type: string
          example: paystack
        provider_reference:
          type: string
          nullable: true
          example: pstk_ref_123456
        amount_kobo:
          $ref: '#/components/schemas/MoneyKobo'
        currency:
          type: string
          const: NGN
          example: NGN
        status:
          type: string
          enum: [initialized, pending, successful, failed, abandoned]
          example: successful
        resolution_status:
          type: string
          enum: [none, requires_action]
          example: none
        notes:
          type: string
          nullable: true
          example: payment_received_after_cancellation
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminOrderPaymentsResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [attempts, events]
          properties:
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/AdminPaymentAttempt'
            events:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  provider:
                    type: string
                  event_type:
                    type: string
                  provider_reference:
                    type: string
                  processing_status:
                    type: string
                  created_at:
                    type: string
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    ReconciliationResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - reconciled
            - payment_reference
            - attempt_status
            - order_payment_status
            - order_fulfilment_status
            - resolution_status
          properties:
            reconciled:
              type: boolean
              example: true
            payment_reference:
              type: string
              example: PAY-SYNC-9AB4C3D2E1F0G8H7J6K5
            attempt_status:
              type: string
              example: successful
            order_payment_status:
              type: string
              example: paid
            order_fulfilment_status:
              type: string
              example: confirmed
            resolution_status:
              type: string
              example: none
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    # Authentication Models
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@vintageboutique.ng
        password:
          type: string
          format: password
          example: SecureAdminPassphrase123!

    AuthSuccessResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [access_token, token_type, expires_in, admin]
          properties:
            access_token:
              type: string
              description: Short-lived signed JWT access token
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              description: Token expiration in seconds (default 900 = 15 minutes)
              example: 900
            admin:
              type: object
              required: [id, email, full_name, is_active]
              properties:
                id:
                  type: string
                  example: usr_admin123
                email:
                  type: string
                  format: email
                  example: admin@vintageboutique.ng
                full_name:
                  type: string
                  example: Store Manager
                is_active:
                  type: boolean
                  example: true
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    CurrentAdminResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [admin]
          properties:
            admin:
              type: object
              required: [id, email, full_name, is_active]
              properties:
                id:
                  type: string
                  example: usr_admin123
                email:
                  type: string
                  format: email
                  example: admin@vintageboutique.ng
                full_name:
                  type: string
                  example: Store Manager
                is_active:
                  type: boolean
                  example: true
        meta:
          $ref: '#/components/schemas/SuccessMeta'

  # =========================================================================
  # Standard Error Responses
  # =========================================================================
  responses:
    BadRequest:
      description: The request was malformed or missing required parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Missing or invalid request payload.
            meta:
              request_id: req_66c1f8a2b3c4d

    Unauthenticated:
      description: Missing, expired, or invalid administrator authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Authentication required.
            meta:
              request_id: req_66c1f8a2b3c4d

    Forbidden:
      description: Insufficient permissions or CSRF / origin check failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ProfileNotFound:
      description: Business profile has not been initialized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BUSINESS_PROFILE_NOT_FOUND
              message: The business profile was not found.
            meta:
              request_id: req_66c1f8a2b3c4d

    CategoryNotFound:
      description: The requested category was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CATEGORY_NOT_FOUND
              message: The requested category does not exist.
            meta:
              request_id: req_66c1f8a2b3c4d

    ProductNotFound:
      description: The requested product was not found or is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: PRODUCT_NOT_FOUND
              message: The requested product does not exist.
            meta:
              request_id: req_66c1f8a2b3c4d

    OrderNotFound:
      description: The requested order was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ORDER_NOT_FOUND
              message: The requested order does not exist.
            meta:
              request_id: req_66c1f8a2b3c4d

    ConfirmationTokenInvalid:
      description: The supplied order confirmation token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFIRMATION_TOKEN_INVALID
              message: Order confirmation token is missing or invalid.
            meta:
              request_id: req_66c1f8a2b3c4d

    Conflict:
      description: Resource conflict (e.g. duplicate slug or conflicting state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnsupportedMediaType:
      description: Content-Type must be application/json or multipart/form-data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Content-Type must be application/json.
            meta:
              request_id: req_66c1f8a2b3c4d

    ValidationFailed:
      description: Input validation failed on one or more fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: The request payload failed field validation.
              fields:
                customer_name:
                  - 'Customer name is required.'
            meta:
              request_id: req_66c1f8a2b3c4d

    RateLimited:
      description: Too many requests. Rate limit window exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many attempts. Please try again later.
            meta:
              request_id: req_66c1f8a2b3c4d

    InternalError:
      description: Production-safe internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
            meta:
              request_id: req_66c1f8a2b3c4d
