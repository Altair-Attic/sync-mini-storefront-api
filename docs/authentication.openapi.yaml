openapi: 3.1.0
info:
  title: Project Sync Administrator Authentication API
  version: 1.0.0
paths:
  /api/v1/admin/login:
    post:
      summary: Authenticate an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Bearer access token returned}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {description: Login rate limit exceeded}
  /api/v1/admin/me:
    get:
      summary: Return the current active administrator
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Safe administrator response}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/admin/logout:
    post:
      summary: Acknowledge an authenticated client-side logout
      description: Records a safe logout event. The frontend discards its in-memory token; the issued stateless JWT remains valid until expiry.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Logout acknowledged}
        '401': {$ref: '#/components/responses/Unauthenticated'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Unauthenticated:
      description: Authentication failed without verification details
