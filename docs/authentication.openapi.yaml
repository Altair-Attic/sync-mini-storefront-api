openapi: 3.1.0
info:
  title: Project Sync Administrator Authentication API
  version: 1.0.0
paths:
  /api/v1/admin/login:
    post:
      summary: Authenticate an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200': {description: Access token returned and refresh cookie set}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {description: Login rate limit exceeded}
  /api/v1/admin/refresh:
    post:
      summary: Rotate the refresh token and issue an access token
      security: [{refreshCookie: []}]
      responses:
        '200': {description: Access token returned and refresh cookie rotated}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/admin/me:
    get:
      summary: Return the current active administrator
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Safe administrator response}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/admin/logout:
    post:
      summary: Revoke the current refresh-token family and the supplied Bearer access token, then expire its cookie
      security: [{refreshCookie: []}, {bearerAuth: []}]
      responses:
        '200': {description: Logout completed, including when already logged out}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    refreshCookie: {type: apiKey, in: cookie, name: project_sync_refresh}
  responses:
    Unauthenticated:
      description: Authentication failed without verification details
