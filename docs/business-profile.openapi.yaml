openapi: 3.1.0
info:
  title: Project Sync Business Profile API
  version: 1.0.0
paths:
  /api/v1/store:
    get:
      summary: Retrieve the public storefront profile
      operationId: getStoreProfile
      responses:
        '200':
          description: Storefront-safe profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileResponse'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/profile:
    get:
      summary: Retrieve the editable administrator profile
      operationId: getAdminProfile
      security:
        - adminSession: []
      responses:
        '200':
          description: Complete safe administrator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Replace editable business-profile fields
      operationId: updateAdminProfile
      security:
        - adminSession: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated safe administrator profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: project_sync_admin
  schemas:
    PublicProfile:
      type: object
      additionalProperties: false
      required: [business_name, slug, domain, whatsapp_number, support_email, logo_url, template_id, currency, timezone, delivery_enabled, pickup_enabled, fixed_delivery_fee_kobo]
      properties:
        business_name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string }
        domain: { type: string }
        whatsapp_number: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        support_email: { type: [string, 'null'], format: email, maxLength: 254 }
        logo_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        template_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        currency: { type: string, const: NGN }
        timezone: { type: string }
        delivery_enabled: { type: boolean }
        pickup_enabled: { type: boolean }
        fixed_delivery_fee_kobo: { type: integer, minimum: 0 }
    AdminProfile:
      type: object
      additionalProperties: false
      required: [id, business_name, slug, domain, whatsapp_number, support_email, order_notification_email, merchant_email_notifications_enabled, customer_email_notifications_enabled, whatsapp_handoff_enabled, logo_url, template_id, currency, timezone, delivery_enabled, pickup_enabled, fixed_delivery_fee_kobo, created_at, updated_at]
      properties:
        id: { type: string }
        business_name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string }
        domain: { type: string }
        whatsapp_number: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        support_email: { type: [string, 'null'], format: email, maxLength: 254 }
        order_notification_email: { type: [string, 'null'], format: email, maxLength: 254 }
        merchant_email_notifications_enabled: { type: boolean }
        customer_email_notifications_enabled: { type: boolean }
        whatsapp_handoff_enabled: { type: boolean }
        logo_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        template_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        currency: { type: string, const: NGN }
        timezone: { type: string }
        delivery_enabled: { type: boolean }
        pickup_enabled: { type: boolean }
        fixed_delivery_fee_kobo: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [business_name, whatsapp_number, support_email, order_notification_email, merchant_email_notifications_enabled, customer_email_notifications_enabled, whatsapp_handoff_enabled, logo_url, template_id, currency, timezone, delivery_enabled, pickup_enabled, fixed_delivery_fee_kobo]
      properties:
        business_name: { type: string, minLength: 2, maxLength: 120 }
        whatsapp_number: { type: string }
        support_email: { type: [string, 'null'], format: email, maxLength: 254 }
        order_notification_email: { type: [string, 'null'], format: email, maxLength: 254 }
        merchant_email_notifications_enabled: { type: boolean }
        customer_email_notifications_enabled: { type: boolean }
        whatsapp_handoff_enabled: { type: boolean }
        logo_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        template_id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
        currency: { type: string, const: NGN }
        timezone: { type: string }
        delivery_enabled: { type: boolean }
        pickup_enabled: { type: boolean }
        fixed_delivery_fee_kobo: { type: integer, minimum: 0 }
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
    PublicProfileResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [profile]
          properties:
            profile: { $ref: '#/components/schemas/PublicProfile' }
        meta: { $ref: '#/components/schemas/Meta' }
    AdminProfileResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [profile]
          properties:
            profile: { $ref: '#/components/schemas/AdminProfile' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorResponse:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
  responses:
    Unauthenticated:
      description: Administrator authentication is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CsrfInvalid:
      description: CSRF verification failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ProfileNotFound:
      description: Onboarding has not created a business profile
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: Content-Type is not application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: The request body failed field validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Production-safe internal error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
